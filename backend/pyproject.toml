[project]
name = "annotool-backend"
version = "0.1.0"
description = "Annotation + time-tracking web app backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "authlib>=1.3",
  "itsdangerous>=2.2",
  "httpx>=0.27",
  "pillow>=10.3",
  "reportlab>=4.2",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
