# Render blueprint. After `bash deploy.sh` pushes to GitHub, Render reads this file
# and creates ONE web service that bundles the React build inside the FastAPI Docker image.
services:
  - type: web
    name: annotool-mm34
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OAUTH_REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_EMAILS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: PUSH_TOKEN
        sync: false
      - key: DEFAULT_HOURLY_RATE_CENTS
        value: "2500"
