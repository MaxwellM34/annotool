# Fly.io deployment config. App name is overridden by `deploy.sh` via $APP_NAME
# but if you `fly deploy` by hand this default is used.
app = "annotool"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
